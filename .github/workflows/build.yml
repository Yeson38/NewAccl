name: Build NewAccl

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: new-accl-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: new-accl-windows
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: new-accl-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Ensure target is installed
      run: rustup target add ${{ matrix.target }}
      if: matrix.target == 'x86_64-apple-darwin' || matrix.target == 'aarch64-apple-darwin'

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        cache-bin: 'false'

    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libgtk-4-dev \
          libadwaita-1-dev \
          libglib2.0-dev \
          libgirepository1.0-dev \
          pkg-config

    - name: Build Release
      run: cargo build --release --target ${{ matrix.target }}

    # 新增步骤：把编译产物和配置、证书复制到一个干净的文件夹里
    - name: Prepare Package Directory
      shell: bash
      run: |
        mkdir package
        cp target/${{ matrix.target }}/release/new-accl package/ 2>/dev/null || true
        cp target/${{ matrix.target }}/release/new-accl.exe package/ 2>/dev/null || true
        cp config.json package/ 2>/dev/null || true
        # 程序首次运行会自动生成证书，如果生成了也一并放进包里
        cp ca.crt package/ 2>/dev/null || true
        cp ca.key package/ 2>/dev/null || true

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        # 只打包这个干净的 package 目录
        path: package/
