name: Build NewAccl

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          # Linux (保持原样)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: new-accl-linux
          # Windows (保持原样)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: new-accl-windows
          # macOS (修复：指定为 Apple Silicon 原生架构)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: new-accl-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    # 关键修复：在缓存步骤后，显式再次安装目标，防止缓存覆盖
    - name: Ensure target is installed
      run: rustup target add ${{ matrix.target }}
      if: matrix.target == 'x86_64-apple-darwin' || matrix.target == 'aarch64-apple-darwin'

    # 关键修复：禁用缓存二进制文件，防止 macOS 上的工具链损坏
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        cache-bin: 'false'

    - name: Build Release
      run: cargo build --release --target ${{ matrix.target }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: |
          target/${{ matrix.target }}/release/new-accl
          target/${{ matrix.target }}/release/new-accl.exe
          target/${{ matrix.target }}/release/ca.crt
          target/${{ matrix.target }}/release/ca.key