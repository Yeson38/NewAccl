name: Build NewAccl

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # 允许手动点击按钮编译

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: new-accl-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: new-accl-windows
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: new-accl-macos

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Build Release
      run: cargo build --release --target ${{ matrix.target }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: |
          target/${{ matrix.target }}/release/new-accl
          target/${{ matrix.target }}/release/new-accl.exe
          target/${{ matrix.target }}/release/ca.crt
          target/${{ matrix.target }}/release/ca.key
